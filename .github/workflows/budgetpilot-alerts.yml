name: BudgetPilot Alerts

on:
  schedule:
    - cron: '15 6-22/2 * * *'
      timezone: 'Africa/Tunis'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: budgetpilot-alerts

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests

    - name: Check BudgetPilot alerts
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python budgetpilot_alerts.py

    - name: Save state
      run: |
        git config user.name "budgetpilot-bot"
        git config user.email "bot@users.noreply.github.com"
        git add budgetpilot-notified.json
        git diff --staged --quiet || git commit -m "Update BudgetPilot alert state"
        git pull --rebase
        git push
