name: Site Monitoring

on:
  schedule:
    - cron: '0 5-19/2 * * *'
    - cron: '0 6-20/2 * * *'
    - cron: '30 5-20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests beautifulsoup4

    - name: Run monitoring script
      env:
        SCAN_MODE: ${{ github.event.schedule == '0 5-19/2 * * *' && 'complet' || 'institutions' }}
      run: python monitor.py

    - name: Save state
      run: |
        git config user.name "monitor-bot"
        git config user.email "bot@users.noreply.github.com"
        git pull --rebase
        git add state.json
        git diff --staged --quiet || git commit -m "Update state"
        git push
