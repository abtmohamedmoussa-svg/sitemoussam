name: Resume Marches

on:
  schedule:
    - cron: '0 6,9,13,16 * * 1-5'
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install requests beautifulsoup4
    - run: python summary.py
